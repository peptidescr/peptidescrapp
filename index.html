<!doctype html>
<html lang="%BRAND_LANG%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="%BRAND_THEME_DARK%" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <!-- One address for search engines, whichever one a visitor used (see src/brand/seo.ts). -->
    <link rel="canonical" href="%BRAND_SITE_URL%/" />

    <!-- Link previews: Facebook, WhatsApp, iMessage, LinkedIn, Slack; X falls back to these too. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_STORE_NAME%" />
    <meta property="og:title" content="%BRAND_TITLE%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:url" content="%BRAND_SITE_URL%/" />
    <meta property="og:locale" content="%BRAND_OG_LOCALE%" />
    <meta property="og:image" content="%BRAND_SHARE_IMAGE%" />
    <meta property="og:image:width" content="%BRAND_SHARE_IMAGE_WIDTH%" />
    <meta property="og:image:height" content="%BRAND_SHARE_IMAGE_HEIGHT%" />
    <meta property="og:image:alt" content="%BRAND_HEADLINE%" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data: the site, the app, and the store that publishes them. -->
    <script type="application/ld+json">%BRAND_JSON_LD%</script>

    <!--
      Google shows one icon per site in search results, and only one that is
      square and a multiple of 48px (48, 96, 144…), so a 96px icon is listed
      first. /favicon.ico (16, 32 and 48px) is the address crawlers and older
      browsers try without being told. Both are made from brand/icon-512.png.
    -->
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/favicon-96.png" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <!-- iOS home-screen install support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_SHORT_NAME%" />

    <title>%BRAND_TITLE%</title>

    <!--
      Pre-paint theme resolution. Settings.theme (the source of truth) lives
      in Dexie, which is async — by the time it loads the app has already
      painted. This synchronous read of the localStorage mirror that
      src/lib/theme.ts's applyTheme() writes on every change is what avoids a
      flash of the wrong theme. Runs as a plain classic script (not
      type="module", which is deferred) so it executes immediately, before
      the module script and before anything is painted. Deliberately tiny
      and dependency-free; the 'peptidescr:theme' key must be kept in sync
      with src/lib/theme.ts by hand. The %BRAND_*% placeholders are filled
      at build time from src/brand/brands.ts (see vite.config.ts).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('peptidescr:theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '%BRAND_THEME_LIGHT%' : '%BRAND_THEME_DARK%')
        } catch (e) {
          // localStorage can throw (private mode, disabled) — default stays
          // dark, matching tokens.css's base :root block.
        }
      })()
    </script>
  </head>
  <body>
    <!--
      The loading splash, and the page's text for anything that reads the HTML
      without running the app: search engines' first pass, link previews, AI
      crawlers. React replaces it as soon as it starts, with
      src/components/BootSplash.tsx (the same markup) until settings load, so
      people see one steady splash, not a flash of something else. Keep the
      two the same.
    -->
    <div id="root">
      <main class="flex min-h-dvh flex-col items-center justify-center gap-4 bg-background px-6 text-center">
        <img src="/brand/icon-192.png" alt="%BRAND_STORE_NAME%" width="72" height="72" class="size-18 rounded-2xl" />
        <h1 class="max-w-sm font-display text-xl font-bold leading-snug text-foreground">%BRAND_HEADLINE%</h1>
        <p class="max-w-sm text-sm text-muted-foreground">%BRAND_DESCRIPTION%</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
