<!doctype html>
<html lang="%BRAND_LANG%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="%BRAND_THEME_LIGHT%" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <!-- iOS home-screen install support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" (dark text): "black-translucent" draws white status-bar text over the page, which a light page swallows. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_SHORT_NAME%" />

    <title>%BRAND_TITLE%</title>

    <!--
      Pre-paint theme resolution. Settings.theme (the source of truth) lives
      in Dexie, which is async — by the time it loads the app has already
      painted. This synchronous read of the localStorage mirror that
      src/lib/theme.ts's applyTheme() writes on every change is what avoids a
      flash of the wrong theme. Runs as a plain classic script (not
      type="module", which is deferred) so it executes immediately, before
      the module script and before anything is painted. Deliberately tiny
      and dependency-free; the 'peptidescr:theme' key and SWITCHING must be
      kept in sync with src/lib/theme.ts by hand. The %BRAND_*% placeholders
      are filled at build time from src/brand/brands.ts (see vite.config.ts).
      The app is light-only for now, so while SWITCHING is false the stored
      value is ignored and the page is always light.
    -->
    <script>
      (function () {
        // Keep in sync with THEME_SWITCHING_ENABLED in src/lib/theme.ts.
        var SWITCHING = false
        try {
          var stored = localStorage.getItem('peptidescr:theme')
          var theme = !SWITCHING
            ? 'light'
            : stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '%BRAND_THEME_LIGHT%' : '%BRAND_THEME_DARK%')
        } catch (e) {
          // localStorage can throw (private mode, disabled) — fall back to
          // light, matching tokens.css's base :root block.
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
